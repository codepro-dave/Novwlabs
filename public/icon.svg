<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c1538" />
      <stop offset="50%" stop-color="#090e29" />
      <stop offset="100%" stop-color="#050814" />
    </linearGradient>
    <linearGradient id="wingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Shield -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" stroke="#00F0FF" stroke-width="12" stroke-opacity="0.6" />
  
  <!-- Cyber Circuit Trace Lines -->
  <path d="M96 256 L180 256 L220 160 L292 352 L332 256 L416 256" stroke="#00F0FF" stroke-width="12" stroke-linecap="round" stroke-opacity="0.35" fill="none" />
  
  <!-- FREEDREAM Delta Wing -->
  <path d="M256 64 L416 396 L256 328 L96 396 Z" fill="url(#wingGrad)" stroke="#00F0FF" stroke-width="14" stroke-linejoin="round" filter="url(#glow)" />
  
  <!-- Golden Core Orbit -->
  <circle cx="256" cy="256" r="48" fill="#090E29" stroke="#F59E0B" stroke-width="12" />
  <circle cx="256" cy="256" r="22" fill="#F59E0B" filter="url(#glow)" />
</svg>
